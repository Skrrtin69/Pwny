name: Build iOS Pwny

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout matching Pwny source
        uses: actions/checkout@v4
        with:
          ref: 0efb57f9f80bab3e742d39601154c0ef8653886a
          fetch-depth: 1

      - name: Show Apple build environment
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version

          sdk_path="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "SDK=$sdk_path" >> "$GITHUB_ENV"

          echo "iPhoneOS SDK: $sdk_path"
          xcrun --sdk iphoneos --show-sdk-version
          clang --version

      - name: Install build utilities
        shell: bash
        run: |
          set -euo pipefail
          brew install autoconf automake libtool cmake

      - name: Pin compatible Mbed TLS
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("make/Makefile.mbedtls")
          text = path.read_text()

          old = "git clone https://github.com/mbed-tls/mbedtls mbed-tls;"
          new = (
              "git clone --depth 1 --branch mbedtls-2.28.9 "
              "https://github.com/mbed-tls/mbedtls mbed-tls;"
          )

          if old not in text:
              raise SystemExit("Expected Mbed TLS clone command was not found.")

          path.write_text(text.replace(old, new))
          print("Pinned Mbed TLS 2.28.9")
          PY

      - name: Build iOS dependencies
        shell: bash
        run: |
          set -euo pipefail

          chmod +x toolchain/make/ios_arm64.sh

          make -C make clean
          make -C make \
            PLATFORM=ios \
            ARCH=arm64 \
            MAKE_TOOLCHAIN_FILE=../toolchain/make/ios_arm64.sh

      - name: Build iPhone ARM64 implant
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            -S . \
            -B build-ios \
            -DCMAKE_TOOLCHAIN_FILE=toolchain/cmake/ios_arm64.cmake \
            -DCMAKE_OSX_SYSROOT="$SDK" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DMAIN=ON \
            -DSOURCE=src/main/main.c

          cmake --build build-ios --parallel

      - name: Validate implant
        shell: bash
        run: |
          set -euo pipefail

          cp build-ios/main aarch64.bin
          chmod 755 aarch64.bin

          file aarch64.bin
          lipo -info aarch64.bin
          otool -l aarch64.bin > aarch64.otool.txt
          shasum -a 256 aarch64.bin > aarch64.bin.sha256

          file aarch64.bin | grep "Mach-O 64-bit executable arm64"
          test "$(stat -f %z aarch64.bin)" -gt 100000

          cat aarch64.bin.sha256

      - name: Upload compiled implant
        uses: actions/upload-artifact@v4
        with:
          name: pwny-iphone-aarch64
          path: |
            aarch64.bin
            aarch64.bin.sha256
            aarch64.otool.txt
          if-no-files-found: error
